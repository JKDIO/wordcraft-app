# 소스 스냅샷(.tgz)을 CI가 풀어 app/ 트리로 만든다.
#
# ★왜 CI가 푸는가★ 소스는 556KB다. 모델 문맥으로 통과시키면 토큰이 수십만 개 든다(L7).
#   저장소에 이미 있는 tgz를 CI가 풀면 토큰이 0이다.
#
# 방아쇠: `_ci/bootstrap.txt` 를 밀면 실행된다. 내용은 풀 tgz 경로 한 줄.
name: WC Bootstrap Source

on:
  push:
    paths: ['_ci/bootstrap.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wc-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract snapshot into app/
        run: |
          set -euo pipefail
          TGZ=$(tr -d ' \r\n' < _ci/bootstrap.txt)
          echo "snapshot: $TGZ"
          test -f "$TGZ"
          rm -rf /tmp/x && mkdir -p /tmp/x
          tar xzf "$TGZ" -C /tmp/x
          # 최상위가 단일 디렉터리면 그 안을 쓴다
          n=$(ls -1A /tmp/x | wc -l)
          top=$(ls -1A /tmp/x | head -1)
          if [ "$n" = "1" ] && [ -d "/tmp/x/$top" ]; then SRC="/tmp/x/$top"; else SRC="/tmp/x"; fi
          echo "source root: $SRC"
          rm -rf app && mkdir -p app
          cp -r "$SRC"/. app/
          rm -rf app/node_modules app/dist app/.git

      - name: Write report
        run: |
          set -euo pipefail
          mkdir -p _ci
          {
            echo "# bootstrap report $(date -u +%FT%TZ)"
            echo "commit=$GITHUB_SHA"
            echo
            echo "## key files"
            for f in package.json bunfig.toml tsconfig.json index.html build.sh src/main.tsx public/app.css; do
              if [ -e "app/$f" ]; then echo "OK   $f"; else echo "MISS $f"; fi
            done
            echo
            echo "## package.json"
            cat app/package.json 2>/dev/null || echo '(none)'
            echo
            echo "## file count"
            find app -type f | wc -l
            echo
            echo "## tree (src, public)"
            find app/src app/public -type f 2>/dev/null | sort
          } > _ci/BOOTSTRAP_REPORT.txt
          head -40 _ci/BOOTSTRAP_REPORT.txt

      - name: Commit
        run: |
          git config user.name  'wc-ci'
          git config user.email 'ci@wordcraft.local'
          git add -A app _ci
          git commit -m 'ci: bootstrap source tree from snapshot [skip ci]' || { echo 'nothing to commit'; exit 0; }
          git push

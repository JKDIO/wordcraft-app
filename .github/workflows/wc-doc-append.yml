# 큰 문서에 한 줄 추가하는 비용을 없앤다.
#
# ★왜★ RELEASE_LOG 150KB · LESSONS 52KB 같은 append-only 문서에 한 항목 추가하려고
#   파일 전체를 커밋하면 바이트 전부가 모델 문맥을 통과한다(L7·L34).
#   조각 파일만 밀면 CI가 붙여 준다 → 비용이 조각 크기로 끝난다.
#
# 사용법: `_ci/append/무엇이든지.md` 를 커밋한다. 첫 줄은 반드시
#   TARGET: <붙일 파일 경로>
# 그 다음 줄부터가 본문이다. CI가 본문을 대상 파일 끝에 붙이고 조각을 지운다.
name: 예한이앱 · WC Doc Append

on:
  push:
    paths: ['_ci/append/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wc-doc-append

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          done_any=0
          for f in _ci/append/*.md; do
            target=$(head -1 "$f" | sed -n 's/^TARGET:[[:space:]]*//p')
            if [ -z "$target" ]; then
              echo "::error::$f 의 첫 줄에 'TARGET: <경로>' 가 없다"; exit 1
            fi
            if [ ! -f "$target" ]; then
              echo "::error::대상 파일이 없다: $target"; exit 1
            fi
            echo "append: $f -> $target"
            printf '\n' >> "$target"
            tail -n +2 "$f" >> "$target"
            rm "$f"
            done_any=1
          done
          if [ "$done_any" = "0" ]; then echo 'no fragments'; fi
          mkdir -p _ci
          { echo "# doc append $(date -u +%FT%TZ)"; echo "commit=$GITHUB_SHA"; git status --porcelain; } > _ci/APPEND_REPORT.txt
          cat _ci/APPEND_REPORT.txt

      - name: Commit
        run: |
          git config user.name  'wc-ci'
          git config user.email 'ci@wordcraft.local'
          git add -A
          git commit -m 'ci: append doc fragments [skip ci]' || { echo 'nothing'; exit 0; }
          git push

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <title>WordCraft — 영어 모험</title>
  <link rel="stylesheet" href="/app.css?v=1.4.61" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WordCraft" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>" />
</head>
<body>
  <div id="root"></div>
  <script>
    // v1.4.60 상단 안전영역 — 폰 상태 표시줄(시계·배터리) 아래로 앱을 내린다.
    // 1차: CSS env(safe-area-inset-top) (67-safe-top.css). 2차: 앱(Capacitor) 안에서 WebView 가 그 값을 0 으로 보고하면(WebView<140 실측 사례) 32px 로 대체한다.
    (function(){try{
      var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden';
      document.documentElement.appendChild(d);var v=parseFloat(getComputedStyle(d).paddingTop)||0;d.remove();
      var native=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
      if(v===0&&native)document.documentElement.style.setProperty('--wc-inset-top-fallback','32px');
      document.documentElement.setAttribute('data-inset-top',String(v)+(native?' native':''));
    }catch(e){}})();
  </script>
  <script type="module" src="/main.js?v=1.4.61"></script>
</body>
</html>
